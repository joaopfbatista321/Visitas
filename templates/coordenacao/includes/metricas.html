<div class="row g-3 mb-4">
  {% for item in metricas %}
    <div class="col-sm-6 col-xl-3">
      <div class="card coord-kpi shadow-sm h-100 mb-0">
        <div class="card-body d-flex justify-content-between align-items-center gap-3">
          <div class="min-w-0">
            <p class="text-muted mb-1">{{ item.titulo }}</p>
            <h3 class="coord-kpi-value mb-0 text-truncate">{{ item.valor }}</h3>
            {% if item.detalhe %}
              <small class="text-muted">{{ item.detalhe }}</small>
            {% endif %}
          </div>
          <div class="avtar bg-light-{{ item.cor }} text-{{ item.cor }} flex-shrink-0">
            <i data-feather="{{ item.icone }}"></i>
          </div>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
